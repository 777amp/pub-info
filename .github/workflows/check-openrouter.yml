on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'openrouter/model-updates/allowed_models.json'
      - 'openrouter/model-updates/hidden_models.json'

jobs:
  sync-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch catalog and sync hidden/markdown files
        run: |
          curl -sS https://openrouter.ai/api/v1/models |
            jq '.' > openrouter/model-updates/models.json
          python3 openrouter/model-updates/sync_models.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add openrouter/model-updates/models.json \
                  openrouter/model-updates/hidden_models.json \
                  openrouter/model-updates/seen_models.json \
                  openrouter/model-updates/MODELS.md \
                  openrouter/model-updates/allowed_models.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync OpenRouter models, hidden list, and markdown"
            git push
          else
            echo "No changes detected."
          fi