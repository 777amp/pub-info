name: check-openrouter

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      hide:
        description: Comma-separated model IDs to hide manually
        type: string
        default: ''

  push:
    paths:
      - 'openrouter/model-updates/allowed_models.json'
      - 'openrouter/model-updates/hidden_models.json'
      - 'openrouter/model-updates/sync_models.py'
      - 'shared/modelmd.py'

concurrency:
  group: model-trackers
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch catalog and sync files
        env:
          REVIEW_ALLOWLIST: ${{ github.event_name == 'workflow_dispatch' }}
          HIDE: ${{ inputs.hide }}
        run: |
          curl -fsS https://openrouter.ai/api/v1/models | jq '.' > /tmp/models.json
          mv /tmp/models.json openrouter/model-updates/models.json
          python3 openrouter/model-updates/sync_models.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md shared openrouter/model-updates

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync OpenRouter models"
            git push
          else
            echo "No changes detected."
          fi