on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mark_seen:
        description: Mark all currently listed models as seen
        type: boolean
        default: false
      hide:
        description: Comma-separated model IDs to hide
        type: string
        default: ''
  push:
    paths:
      - 'openrouter/model-updates/allowed_models.json'
      - 'openrouter/model-updates/hidden_models.json'
      - 'openrouter/model-updates/sync_models.py'

jobs:
  sync-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch catalog and sync files
        env:
          MARK_SEEN: ${{ inputs.mark_seen }}
          HIDE: ${{ inputs.hide }}
        run: |
          curl -sS https://openrouter.ai/api/v1/models |
            jq '.' > openrouter/model-updates/models.json
          python3 openrouter/model-updates/sync_models.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md \
                  openrouter/model-updates/models.json \
                  openrouter/model-updates/hidden_models.json \
                  openrouter/model-updates/seen_models.json \
                  openrouter/model-updates/MODELS.md \
                  openrouter/model-updates/allowed_models.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync OpenRouter models, README, and markdown"
            git push
          else
            echo "No changes detected."
          fi
